name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-guestlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # No npm packages today (built-ins only); this fails the run if one with a known
      # high or critical vulnerability is ever added.
      - run: npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The deploy secrets live in the "production" environment, which only the main branch can
    # use. So a collaborator's branch, or a workflow they write on it, can never read the SSH key.
    environment: production
    steps:
      # A missing secret fails the run (red), so a deploy that didn't happen never looks green.
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Not deployed: the production environment is missing:$missing (Settings → Environments → production)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to droplet
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use fallback; set DEPLOY_KNOWN_HOSTS to pin the host key instead.
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          # Deploy exactly the commit that just passed tests, not whatever main points at now.
          # Only touches /srv/guestlist and the guestlist unit. data/ is git-ignored,
          # so reset --hard never touches the database or backups.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "venue@$DEPLOY_HOST" "GIT_SHA=$GIT_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/guestlist
          git fetch --quiet origin main
          git reset --hard "$GIT_SHA"
          sudo -n /bin/systemctl restart guestlist
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5070/health | grep -q '"ok":true'; then
              echo "Healthy: $(git log -1 --format='%h %s')"
              exit 0
            fi
            sleep 1
          done
          echo "guestlist failed its health check after restart" >&2
          exit 1
          REMOTE
