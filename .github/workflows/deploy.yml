name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-guestlist
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # No npm packages today (built-ins only); this fails the run if one with a known
      # high or critical vulnerability is ever added.
      - run: npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The deploy secrets live in the "production" environment, which only the main branch can
    # use. So a collaborator's branch, or a workflow they write on it, can never read the SSH key.
    environment: production
    steps:
      # Until the DEPLOY_* secrets are added, skip quietly instead of failing.
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: add DEPLOY_HOST and DEPLOY_SSH_KEY secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to droplet
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          # Only touches /srv/guestlist and the guestlist unit. data/ is git-ignored,
          # so reset --hard never touches the database or backups.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "venue@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/guestlist
          git fetch --quiet origin main
          git reset --hard origin/main
          sudo -n /bin/systemctl restart guestlist
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5070/health | grep -q '"ok":true'; then
              echo "Healthy: $(git log -1 --format='%h %s')"
              exit 0
            fi
            sleep 1
          done
          echo "guestlist failed its health check after restart" >&2
          exit 1
          REMOTE
