name: Test

# Every pull request and every branch other than main: run the tests. No secrets, no deploy.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # No npm packages today (built-ins only); this fails the run if one with a known
      # high or critical vulnerability is ever added.
      - run: npm audit --audit-level=high
